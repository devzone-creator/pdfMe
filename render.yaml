services:
  - type: web
    name: file-frenzy
    env: node
    plan: standard
    buildCommand: npm install --legacy-peer-deps
    startCommand: node server.js
    healthCheckPath: /health
    healthCheckInterval: 300
    autoDeploy: true
    
    # Pre-deploy optimization
    preDeployCommand: npm ci --legacy-peer-deps
    
    # Environment variables for performance
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: PORT
        value: 3000
    
    # Instance settings
    numInstances: 1
    
    # Build caching
    buildCache:
      enabled: true
      paths:
        - node_modules
    
    # Graceful shutdown
    maxShutdownDelay: 30
